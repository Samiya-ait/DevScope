<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <title>shortlist</title>
  </head>
  <body
    class="flex flex-col items-center w-screen h-screen  font-[Nunito] bg-gradient-to-r from-[#232347] from-0% via-[#790934] via-35% to-[#ff0073] to-100%"
  >
    <header
      class="flex justify-between w-[90vw] rounded-xl m-1 p-2 bg-pink-100 text-slate-600 font-bold"
    >
      <div>
        <h5>DevScope</h5>
      </div>
      <ul class="flex gap-4">
        <li><a href="index.html">Recherche</a></li>
        <li><a href="shortlist.html">Shortlist</a></li>
      </ul>
    </header>
    <section>
      <h1 class="text-3xl text-center font-bold text-slate-900">
        Ma ShortList
      </h1>
      <p class="compteur text-xs text-center font-bold text-white"></p>
      <div class="flex gap-10 m-2">
        <ul class=" filters flex gap-5 text-slate-900 underline underline-offset-8">
          <li data-cat="tous">tous</li>
          <li data-cat="a_contacter">a contacter</li>
          <li data-cat="refusé">refusé</li>
        </ul>
        <input
          type="search"
          class=" input opacity-75 rounded-lg border border-white w-100 bg-gray-100"
          placeholder="à rechercher..."
        />
      </div>
    </section>
    <main class="container grid grid-cols-2 grid-rows-3 gap-5 w-3/4 m-2"></main>

    <!-- update -->
    <dialog id="updateD" class="m-auto w-96 rounded-xl border-none p-6">
      <h1>Modifier</h1>
      <form action="">
        <p>
          <label for="status">status:</label>
          <select id="status">
            <option value="a_contacter">A contacter</option>
            <option value="refusé">Refusé</option>
          </select>
        </p>
        <p>
          <label for="note">note:</label>
          <input type="text" id="note" />
        </p>

        <label for="rating">rating:</label>
        <select name="" id="rating">
          <option value="5">★★★★★</option>
          <option value="4">★★★★✰</option>
          <option value="3">★★★✰✰</option>
          <option value="2">★★✰✰✰</option>
          <option value="1">★✰✰✰✰</option>
        </select>
        <div>
          <button id="save" type="submit">Enregistrer</button>
          <button type="button" id="cancelUp" class="cancelUp">Annuler</button>
        </div>
      </form>
    </dialog>

    <!-- delete -->
    <dialog id="deleteD" class="m-auto w-96 rounded-xl border-none p-6">
      <h1>Supprimer</h1>
      <p>Voulez-vous supprimer ce candidat?</p>
      <div>
        <button id="delete" class="delete">Supprimer</button>
        <button type="button" id="cancelDlt" class="cancelDlt">Annuler</button>
      </div>
    </dialog>
    <script type="module" src="js/shortlist.js"></script>
  </body>
</html>
